name: Build Windows exe

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$') {
            throw "标签 $tag 不是合法 SemVer（示例：v1.0.0、v1.1.0-rc.1）"
          }
          $version = $tag.Substring(1)
          $line = Select-String -Path rust-backend/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $line) { throw '无法从 rust-backend/Cargo.toml 读取 version' }
          $cargoVersion = $line.Matches[0].Groups[1].Value
          if ($cargoVersion -ne $version) {
            throw "标签 $tag 与 rust-backend/Cargo.toml 的版本 $cargoVersion 不一致，请先更新版本号再打标签"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "version=$version"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend

      - name: Verify Windows SDK rc.exe for exe icon and version info
        run: |
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $rc) { throw 'Windows SDK rc.exe not found; exe icon and version resource cannot be linked' }
          Write-Host "using $($rc.FullName)"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build

      - name: Build Rust backend
        working-directory: rust-backend
        run: cargo build --release --locked

      - name: Package artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item rust-backend/target/release/pdf-manager.exe dist/PDFManager.exe
          $h = (Get-FileHash dist/PDFManager.exe -Algorithm SHA256).Hash
          "$h  PDFManager.exe" | Set-Content -Encoding ascii dist/PDFManager.exe.sha256
          Get-Content dist/PDFManager.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFManager-v${{ env.VERSION }}-windows-x64
          path: |
            dist/PDFManager.exe
            dist/PDFManager.exe.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PDF Manager v${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/PDFManager.exe
            dist/PDFManager.exe.sha256
