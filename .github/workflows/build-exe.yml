name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend

      - name: Verify Windows SDK rc.exe for exe icon
        run: |
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $rc) { throw 'Windows SDK rc.exe not found; exe icon cannot be linked' }
          Write-Host "using $($rc.FullName)"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build

      - name: Build Rust backend
        working-directory: rust-backend
        run: cargo build --release --locked

      - name: Package artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item rust-backend/target/release/pdf-manager.exe dist/PDFManager.exe
          $h = (Get-FileHash dist/PDFManager.exe -Algorithm SHA256).Hash
          "$h  PDFManager.exe" | Set-Content -Encoding ascii dist/PDFManager.exe.sha256
          Get-Content dist/PDFManager.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFManager-windows-x64
          path: |
            dist/PDFManager.exe
            dist/PDFManager.exe.sha256
          if-no-files-found: error

      - name: Attach to release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PDFManager.exe
            dist/PDFManager.exe.sha256
